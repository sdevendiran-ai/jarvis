<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCREVIVAL</title>
    <style>
        /* Unified Body Styles to resolve CSS override conflicts */
        body {
            background-color: black;
            color: blueviolet;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-image: url('https://t4.ftcdn.net/jpg/07/51/96/11/360_F_751961137_cO7i1u5j2qyGzlJp7tTEGKDrt8BHv5iF.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        #title {
            color: blueviolet;
            text-shadow: 1px 4px 6px;
        }

        #img {
            display: block;
            margin: 0 auto; /* Centered your crown logo profile asset */
        }

        #recordButton {
            background-color: blueviolet;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #333333;
            border-radius: 50px;
            cursor: pointer;
            margin: 15px auto;
            display: inline-block;
            transition: background-color 0.2s, transform 0.1s;
        }

        #recordButton:active {
            transform: scale(0.95);
        }

        #chatMessages {
            color: blueviolet;
            width: 90%;
            max-width: 600px;
            min-height: 250px;
            max-height: 500px;
            background-color: powderblue;   
            border: 2px solid #333333;   
            border-radius: 50px;
            margin: 20px auto; 
            padding: 25px;
            box-sizing: border-box;
            overflow-y: auto;
            text-align: left;
            background-image: url('https://cdn.mos.cms.futurecdn.net/FRdq8ZbPetwNDRV9R3hYpP.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: top;
        }

        #chez {
            color: darkblue;
            margin-top: 0;
        }

        #meslabel {
            font-family: Arial, Helvetica, sans-serif;
        }

        #chatMessages p {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 10px 15px;
            border-radius: 12px;
            margin: 10px 0;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            word-wrap: break-word;
        }
    </style>
</head>

<body>

    <img src="https://prestigeclient.vip/assets/img/logo.png"
         style="width: 200px;" id="img">

    <h1 id="title">JARVIS</h1>
    <div id="titleshadow"></div>

    <!-- Restored target record button element to anchor script event listeners -->
    <button id="recordButton">🎙️ Tap to Speak</button>

    <div id="chatMessages">
        <h2 id="chez">Stream</h2>
    </div>

<script>
    const chatMessages = document.getElementById("chatMessages");
    const recordButton = document.getElementById("recordButton");

    // ⚠️ REPLACE THIS LINK WITH YOUR ACTIVE N8N PRODUCTION WEBHOOK PATH
    const BASE_URL = 'https://railway.app';

    const SpeechEngine = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechEngine) {
        recognition = new SpeechEngine();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            isRecording = true;
            recordButton.innerText = "🛑 Stop Recording";
            recordButton.style.backgroundColor = "#dc3545";
        };

        recognition.onend = () => {
            isRecording = false;
            recordButton.innerText = "🎙️ Tap to Speak";
            recordButton.style.backgroundColor = "blueviolet";
        };

        recognition.onresult = (event) => {
            const voiceText = event.results[0][0].transcript;
            if (voiceText.trim()) {
                sendMessage(voiceText);
            }
        };

        recordButton.addEventListener('click', () => {
            if (!isRecording) {
                window.speechSynthesis.cancel(); 
                recognition.start();
            } else {
                recognition.stop();
            }
        });
    } else {
        recordButton.innerText = "Speech Not Supported";
        recordButton.disabled = true;
    }

    function displayMessage(sender, textContent) {
        const newMessage = document.createElement("p");
        newMessage.textContent = sender + ": " + textContent;
        chatMessages.appendChild(newMessage);
        chatMessages.scrollTop = chatMessages.scrollHeight; 
    }

    async function sendMessage(messageText) {
        displayMessage("Sir", messageText);

        try {
            const networkRoute = `${BASE_URL}?chatInput=${encodeURIComponent(messageText)}`;
            
            const request = await fetch(networkRoute, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });

            if (request.ok) {
                const responseData = await request.text();
                let cleanResponse = "";

                try {
                    const parsedJSON = JSON.parse(responseData);
                    cleanResponse = parsedJSON.output || parsedJSON.response || parsedJSON.text;
                    
                    if (!cleanResponse && Array.isArray(parsedJSON) && parsedJSON.length > 0) {
                        cleanResponse = parsedJSON[0].output || parsedJSON[0].response || parsedJSON[0].text || JSON.stringify(parsedJSON[0]);
                    }
                    if (!cleanResponse) {
                        cleanResponse = JSON.stringify(parsedJSON);
                    }
                } catch {
                    cleanResponse = responseData; 
                }

                displayMessage("JARVIS", cleanResponse);
                speakRobotic(cleanResponse);

            } else {
                displayMessage("SYSTEM ERROR", "Unable to transmit dataset package to n8n framework.");
            }
        } catch (error) {
            displayMessage("SYSTEM ERROR", "Connection fetch path dropped or timed out.");
            console.error(error);
        }
    }

    function speakRobotic(text) {
        if (!text) return;
        window.speechSynthesis.cancel(); 

        const voiceBox = new SpeechSynthesisUtterance(text);
        const engineProfiles = window.speechSynthesis.getVoices();
        const priorityVoice = engineProfiles.find(v => v.name.includes('Google US English') || v.name.includes('Google UK English'));
        
        if (priorityVoice) {
            voiceBox.voice = priorityVoice;
        }

        voiceBox.pitch = 0.5; 
        voiceBox.rate = 1.1;  

        window.speechSynthesis.speak(voiceBox);
    }

    if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = window.speechSynthesis.getVoices;
    }
</script>

</body>
</html>
